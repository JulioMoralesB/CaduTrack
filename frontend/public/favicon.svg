<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- A milk carton with a clock badge: the object says food, the badge says
       expiry. Deliberately not a bare calendar or clock, which would read as a
       different kind of app entirely. -->
  <path d="M14 21h26v29a6 6 0 0 1-6 6H20a6 6 0 0 1-6-6z" fill="#e8e6dd"/>
  <path d="M14 21 27 8l13 13z" fill="#3f7d3a"/>
  <path d="M27 8v13" stroke="#5aa354" stroke-width="2.5"/>
  <!-- The printed lines are the date stamp: where you actually read an expiry. -->
  <rect x="19" y="31" width="15" height="3.2" rx="1.6" fill="#3f7d3a"/>
  <rect x="19" y="38" width="10" height="3.2" rx="1.6" fill="#d9a13a"/>
  <!-- The dark ring separates the badge from the carton behind it. -->
  <circle cx="46" cy="46" r="16" fill="#14170f"/>
  <circle cx="46" cy="46" r="13" fill="#d9a13a"/>
  <path d="M46 38.85V46l5.46 3.9" stroke="#14170f" stroke-width="3.38" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
