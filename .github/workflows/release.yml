name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# amd64 only, and no layer cache — see #163.
#
# The server is amd64. arm64 was built under QEMU emulation, which took the
# frontend from about a minute to over ten (npm ci alone ran 9+ minutes) and
# is where v1.3.0's build hung for six hours.
#
# A tag can't restore a cache saved by another tag, only by itself or main,
# so type=gha never hit: every release built from scratch and then spent
# 30-50 seconds exporting a cache no later release could read.
#
# timeout-minutes is several times a normal run, so a hang fails in minutes
# instead of after GitHub's six-hour limit.

jobs:
  # ─── Frontend image: the thing you actually visit ────────────────────────────
  frontend:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: write  # required for provenance attestation
      id-token: write      # required for OIDC token used by attestation signing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/juliomoralesb/cadutrack
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The tag itself, e.g. "v0.11.0" — baked into the bundle so a
          # deployed instance can say which release it actually is. This
          # workflow only runs on a tag push, so ref_name is always that tag.
          build-args: VERSION=${{ github.ref_name }}

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/juliomoralesb/cadutrack
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ─── Backend image ───────────────────────────────────────────────────────────
  backend:
    name: Build and push backend image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/juliomoralesb/cadutrack-api
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The tag itself, e.g. "v0.11.0" — read by app/config.py at startup
          # and surfaced through /health and /settings.
          build-args: VERSION=${{ github.ref_name }}

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/juliomoralesb/cadutrack-api
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ─── Database image: postgres:16-alpine plus this service's own init
  #     script, baked in rather than bind-mounted — see #56's own follow-up
  #     and db/Dockerfile for why a bind mount does not survive a deploy
  #     that only copies compose.yaml and .env. ───────────────────────────────
  db:
    name: Build and push database image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/juliomoralesb/cadutrack-db
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./db
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/juliomoralesb/cadutrack-db
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
